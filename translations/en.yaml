configuration:
  SOURCE_MQTT_HOST:
    name: SOURCE_MQTT_HOST
    description: Hostname or IP of the source MQTT broker (for Growatt)
  SOURCE_MQTT_PORT:
    name: SOURCE_MQTT_PORT
    description: Port number of the source MQTT broker
  SOURCE_MQTT_TLS:
    name: SOURCE_MQTT_TLS
    description: Set to true to enable TLS without certificate validation
  SOURCE_MQTT_USER:
    name: SOURCE_MQTT_USER
    description: Username for the source MQTT broker (if authentication is required)
  SOURCE_MQTT_PASS:
    name: SOURCE_MQTT_PASS
    description: Password for the source MQTT broker
  TARGET_MQTT_HOST:
    name: TARGET_MQTT_HOST
    description: Hostname or IP of the target MQTT broker (for Home Assistant)
  TARGET_MQTT_PORT:
    name: TARGET_MQTT_PORT
    description: Port number of the target MQTT broker
  TARGET_MQTT_TLS:
    name: TARGET_MQTT_TLS
    description: Set to true to enable TLS without certificate validation
  TARGET_MQTT_USER:
    name: TARGET_MQTT_USER
    description: Username for the target MQTT broker (if authentication is required)
  TARGET_MQTT_PASS:
    name: TARGET_MQTT_PASS
    description: Password for the target MQTT broker
  HA_BASE_TOPIC:
    name: HA_BASE_TOPIC
    description: Base MQTT topic used for Home Assistant auto-discovery and sensor states
  REGISTER_FILTER:
    name: REGISTER_FILTER
    description: No longer used, devices are detected automatically.
  GROWATT_CLOUD:
    name: GROWATT_CLOUD
    description: Set to True to redirect messages to and from the Growatt Server. Default is False
  GROWATT_CLOUD_CONFIG_FILTER:
    name: GROWATT_CLOUD_CONFIG_FILTER
    description: Enable to prevent forwarding config messages. This protects the datalogger from remote setting changes initiated by the Growatt Cloud. Default is False
  LOG_LEVEL:
    name: LOG_LEVEL
    description: Sets the Logging Level. The program currently only use the levels ERROR, DEBUG, and INFO. Default is ERROR.
  DUMP_MESSAGES:
    name: DUMP_MESSAGES
    description: Dumps every received messages into /config/dump for later in-depth inspection.
  MAX_SLOTS:
    name: MAX_SLOTS
    description: How many time slots to show in Home Assistant for battery scheduling (NOAH, NEXA, TL-XH and MOD, max 9). Default is 1.
  MAX_BAT:
    name: MAX_BAT
    description: How many battery packs to display in Home Assistant. With "auto" (default) the count is detected from the device and only ever grows, so a disconnected battery keeps its entities and last known values. Set a number to override; entities of batteries above it are removed.
  DEVICE_TIMEOUT:
    name: DEVICE_TIMEOUT
    description: Set the timeout in seconds for the device communication. Default is 0 (disabled). Recommendation 300+ seconds.
  AVAILABILITY_SENSOR:
    name: AVAILABILITY_SENSOR
    description: Expose device availability only as a dedicated online sensor instead of marking the device and all its entities unavailable after timeout.
  FILTER_DATA_GLITCHES:
    name: FILTER_DATA_GLITCHES
    description: When enabled, prevents glitches on total_increasing sensors (energy counters, etc.) after a device reconnects from being offline. Default is false.
  TZ:
    name: Timezone
    description: Configure your local timezone to ensure all application logs and system events are recorded with accurate localized timestamps.
  KEEP_BATTERY_POSITION:
    name: KEEP_BATTERY_POSITION
    description: When enabled, GroBro tracks NOAH battery serial numbers across position changes and logs a warning if a battery moves to a different slot. Default is false.
  PUBLISH_SENSORS_RETAINED:
    name: PUBLISH_SENSORS_RETAINED
    description: When enabled, sensor states are published as MQTT retained messages, so they are also restored after a restart of the MQTT broker or GroBro. Restarts of Home Assistant are handled without this option, GroBro republishes the last states then. Default is false.
  AUTO_TIME_SYNC:
    name: AUTO_TIME_SYNC
    description: When enabled, GroBro synchronizes the clock of your devices at 00:00 and 12:00. Default is false.
