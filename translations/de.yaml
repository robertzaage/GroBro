configuration:
  SOURCE_MQTT_HOST:
    name: SOURCE_MQTT_HOST
    description: Hostname oder IP-Adresse des Quell-MQTT-Brokers (für Growatt)
  SOURCE_MQTT_PORT:
    name: SOURCE_MQTT_PORT
    description: Port-Nummer des Quell-MQTT-Brokers
  SOURCE_MQTT_TLS:
    name: SOURCE_MQTT_TLS
    description: Aktivieren, um TLS ohne Zertifikatsprüfung zu verwenden
  SOURCE_MQTT_USER:
    name: SOURCE_MQTT_USER
    description: Benutzername für den Quell-MQTT-Broker (falls Authentifizierung erforderlich)
  SOURCE_MQTT_PASS:
    name: SOURCE_MQTT_PASS
    description: Passwort für den Quell-MQTT-Broker
  TARGET_MQTT_HOST:
    name: TARGET_MQTT_HOST
    description: Hostname oder IP-Adresse des Ziel-MQTT-Brokers (für Home Assistant)
  TARGET_MQTT_PORT:
    name: TARGET_MQTT_PORT
    description: Port-Nummer des Ziel-MQTT-Brokers
  TARGET_MQTT_TLS:
    name: TARGET_MQTT_TLS
    description: Aktivieren, um TLS ohne Zertifikatsprüfung zu verwenden
  TARGET_MQTT_USER:
    name: TARGET_MQTT_USER
    description: Benutzername für den Ziel-MQTT-Broker (falls Authentifizierung erforderlich)
  TARGET_MQTT_PASS:
    name: TARGET_MQTT_PASS
    description: Passwort für den Ziel-MQTT-Broker
  HA_BASE_TOPIC:
    name: HA_BASE_TOPIC
    description: Basis-MQTT-Topic für Home Assistant Auto-Discovery und Sensor-Status
  REGISTER_FILTER:
    name: REGISTER_FILTER
    description: Wird nicht mehr verwendet, Geräte werden automatisch erkannt.
  GROWATT_CLOUD:
    name: GROWATT_CLOUD
    description: Wenn aktiviert, werden Nachrichten zur und von der Growatt Cloud weitergeleitet, sodass die ShinePhone App weiter funktioniert. Standard ist deaktiviert.
  GROWATT_CLOUD_CONFIG_FILTER:
    name: GROWATT_CLOUD_CONFIG_FILTER
    description: Wenn aktiviert, werden Konfigurationsnachrichten der Growatt Cloud nicht weitergeleitet. Das schützt deine Geräte vor Einstellungsänderungen aus der Ferne durch die Growatt Cloud. Standard ist deaktiviert.
  LOG_LEVEL:
    name: LOG_LEVEL
    description: Legt das Log-Level fest, ERROR, INFO oder DEBUG. Standard ist ERROR.
  DUMP_MESSAGES:
    name: DUMP_MESSAGES
    description: Wenn aktiviert, wird jede empfangene Nachricht für eine spätere detaillierte Analyse in /config/dump gespeichert. Standard ist deaktiviert.
  MAX_SLOTS:
    name: MAX_SLOTS
    description: Wie viele Zeitfenster in Home Assistant für die Batterieplanung angezeigt werden sollen (NOAH, NEXA, TL-XH und MOD, max 9). Standard ist 1.
  MAX_BAT:
    name: MAX_BAT
    description: Wie viele Batteriemodule in Home Assistant angezeigt werden. Bei "auto" (Standard) wird die Anzahl vom Gerät erkannt und nur erhöht, sodass eine abgeklemmte Batterie ihre Entitäten (und mit KEEP_LAST_VALUES ihre letzten Werte) behält. Eine Zahl überschreibt die Erkennung, Entitäten von Batterien oberhalb davon werden entfernt.
  DEVICE_TIMEOUT:
    name: DEVICE_TIMEOUT
    description: Sekunden ohne Daten, nach denen ein Gerät als nicht verfügbar angezeigt wird. Standard ist 0 (deaktiviert). Empfohlen sind 300 Sekunden oder mehr.
  AVAILABILITY_SENSOR:
    name: AVAILABILITY_SENSOR
    description: Zeigt die Verfügbarkeit nur über einen eigenen Online-Sensor an, statt das Gerät und alle seine Entitäten nach DEVICE_TIMEOUT als nicht verfügbar zu markieren.
  FILTER_DATA_GLITCHES:
    name: FILTER_DATA_GLITCHES
    description: Wenn aktiviert, werden Sprünge in total_increasing-Sensoren (Energiezähler, etc.) unterdrückt, nachdem ein Gerät wieder online geht. Standard ist deaktiviert.
  TZ:
    name: Zeitzone
    description: Deine lokale Zeitzone, damit Logs und Ereignisse mit der richtigen Uhrzeit aufgezeichnet werden.
  KEEP_BATTERY_POSITION:
    name: KEEP_BATTERY_POSITION
    description: Wenn aktiviert, überwacht GroBro die Seriennummern der NOAH-Batterien über Positionswechsel und protokolliert eine Warnung, wenn eine Batterie in einen anderen Steckplatz wechselt. Standard ist deaktiviert.
  PUBLISH_SENSORS_RETAINED:
    name: PUBLISH_SENSORS_RETAINED
    description: Wenn aktiviert, werden Sensorzustände als retained MQTT-Nachrichten veröffentlicht, sodass sie auch nach einem Neustart des MQTT-Brokers oder von GroBro wiederhergestellt werden. Neustarts von Home Assistant werden auch ohne diese Option abgefangen, GroBro sendet dann die letzten Zustände erneut. Standard ist deaktiviert.
  AUTO_TIME_SYNC:
    name: AUTO_TIME_SYNC
    description: Wenn aktiviert, synchronisiert GroBro die Uhrzeit deiner Geräte um 00:00 und 12:00 Uhr. Standard ist deaktiviert.
  KEEP_LAST_VALUES:
    name: KEEP_LAST_VALUES
    description: Wenn aktiviert, behalten Werte, die in den Gerätedaten fehlen (z. B. bei abgeklemmter Batterie), ihren letzten bekannten Wert, statt "unbekannt" anzuzeigen. Werte wie SoC und Status werden nach einem Neustart wiederhergestellt. Live-Werte wie die Leistung fallen auf 0, wenn das Gerät keine Daten mehr sendet, und werden nach einem Neustart nicht wiederhergestellt. Nicht vorhandene Temperatursensoren zeigen "unbekannt". Standard ist deaktiviert.
