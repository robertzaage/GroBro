configuration:
  SOURCE_MQTT_HOST:
    name: SOURCE_MQTT_HOST
    description: Hostname oder IP-Adresse des Quell-MQTT-Brokers (für Growatt)
  SOURCE_MQTT_PORT:
    name: SOURCE_MQTT_PORT
    description: Port-Nummer des Quell-MQTT-Brokers
  SOURCE_MQTT_TLS:
    name: SOURCE_MQTT_TLS
    description: Auf true setzen, um TLS ohne Zertifikatsvalidierung zu aktivieren
  SOURCE_MQTT_USER:
    name: SOURCE_MQTT_USER
    description: Benutzername für den Quell-MQTT-Broker (falls Authentifizierung erforderlich)
  SOURCE_MQTT_PASS:
    name: SOURCE_MQTT_PASS
    description: Passwort für den Quell-MQTT-Broker
  TARGET_MQTT_HOST:
    name: TARGET_MQTT_HOST
    description: Hostname oder IP-Adresse des Ziel-MQTT-Brokers (für Home Assistant)
  TARGET_MQTT_PORT:
    name: TARGET_MQTT_PORT
    description: Port-Nummer des Ziel-MQTT-Brokers
  TARGET_MQTT_TLS:
    name: TARGET_MQTT_TLS
    description: Auf true setzen, um TLS ohne Zertifikatsvalidierung zu aktivieren
  TARGET_MQTT_USER:
    name: TARGET_MQTT_USER
    description: Benutzername für den Ziel-MQTT-Broker (falls Authentifizierung erforderlich)
  TARGET_MQTT_PASS:
    name: TARGET_MQTT_PASS
    description: Passwort für den Ziel-MQTT-Broker
  HA_BASE_TOPIC:
    name: HA_BASE_TOPIC
    description: Basis-MQTT-Topic für Home Assistant Auto-Discovery und Sensor-Status
  REGISTER_FILTER:
    name: REGISTER_FILTER
    description: Wird nicht mehr verwendet, Geräte werden automatisch erkannt.
  GROWATT_CLOUD:
    name: GROWATT_CLOUD
    description: Auf True setzen, um Nachrichten zum und vom Growatt-Server umzuleiten. Standard ist False
  GROWATT_CLOUD_CONFIG_FILTER:
    name: GROWATT_CLOUD_CONFIG_FILTER
    description: Verhindert die Weiterleitung von Konfigurationsnachrichten. Dies schützt den Datenlogger vor ferninitiierten Einstellungänderungen durch die Growatt Cloud
  LOG_LEVEL:
    name: LOG_LEVEL
    description: Legt den Logging-Level fest. Das Programm verwendet derzeit nur die Level ERROR, DEBUG und INFO. Standard ist ERROR.
  DUMP_MESSAGES:
    name: DUMP_MESSAGES
    description: Speichert jede empfangene Nachricht in /config/dump für eine spätere detaillierte Analyse.
  MAX_SLOTS:
    name: MAX_SLOTS
    description: Wie viele Zeitfenster in Home Assistant für die Batterieplanung angezeigt werden sollen (NOAH, NEXA, TL-XH und MOD, max 9). Standard ist 1.
  MAX_BAT:
    name: MAX_BAT
    description: Wie viele Batteriemodule in Home Assistant angezeigt werden sollen. Bei "auto" (Standard) wird die Anzahl vom Gerät erkannt und nur erhöht, sodass ein abgeklemmter Akku seine Entitäten und letzten Werte behält. Eine Zahl überschreibt die Erkennung; Entitäten von Batterien oberhalb davon werden entfernt.
  DEVICE_TIMEOUT:
    name: DEVICE_TIMEOUT
    description: Legt den Timeout in Sekunden fest, wann das Gerät als Nicht Verfügbar angezeigt wird. Default ist 0 (deaktiviert). Empfehlung 300+ Sekunden.
  AVAILABILITY_SENSOR:
    name: AVAILABILITY_SENSOR
    description: Lässt die Geräteverfügbarkeit ausschließlich als dedizierten Online-Sensor anzeigen, anstatt das Gerät und alle seine Entitäten nach Ablauf der Zeitüberschreitung als nicht verfügbar zu markieren.
  FILTER_DATA_GLITCHES:
    name: FILTER_DATA_GLITCHES
    description: Wenn aktiviert, werden Sprünge in total_increasing-Sensoren (Energiezähler, etc.) unterdrückt, nachdem ein Gerät wieder online geht. Standard ist deaktiviert.
  TZ:
    name: Zeitzone
    description: Ändern der lokalen Zeitzone, um sicherzustellen, dass alle Anwendungsprotokolle und Systemereignisse mit korrekten lokalen Zeitstempeln aufgezeichnet werden.
  KEEP_BATTERY_POSITION:
    name: KEEP_BATTERY_POSITION
    description: Wenn aktiviert, überwacht GroBro die Seriennummern der NOAH-Batterien über Positionswechsel und protokolliert eine Warnung, wenn eine Batterie in einen anderen Steckplatz wechselt. Standard ist deaktiviert.
  PUBLISH_SENSORS_RETAINED:
    name: PUBLISH_SENSORS_RETAINED
    description: Wenn aktiviert, werden Sensorzustände als retained MQTT-Nachrichten veröffentlicht, sodass sie auch nach einem Neustart des MQTT-Brokers oder von GroBro wiederhergestellt werden. Neustarts von Home Assistant werden auch ohne diese Option abgefangen, GroBro sendet dann die letzten Zustände erneut. Standard ist deaktiviert.
  AUTO_TIME_SYNC:
    name: AUTO_TIME_SYNC
    description: Wenn aktiviert, synchronisiert GroBro die Uhrzeit deiner Geräte um 00:00 und 12:00 Uhr. Standard ist deaktiviert.
